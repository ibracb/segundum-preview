<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
	<h:head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Detalles del producto</title>
		<h:outputStylesheet library="css" name="styles.css" />
		<style>
			.detalles {
				display: flex;
				justify-content: center;
			}
		</style>
	</h:head>
	<h:body>
		<ui:include src="/segundum/includes/header.xhtml" />
		<h:outputText value="Detalles del producto" styleClass="encabezado" />
		<p:messages id="messages" showDetail="true" closable="true" />
		<div class="detalles">
			<p:panelGrid columns="2">
				<p:outputLabel value="Título"/>
				<p:outputLabel id="titulo" value="#{controladorDetallesProducto.producto.titulo}"/>
				<p:outputLabel value="Descripción"/>
				<p:outputLabel id="descripcion" value="#{controladorDetallesProducto.producto.descripcion}"/>
				<p:outputLabel value="Precio"/>
				<p:outputLabel id="precio" value="#{controladorDetallesProducto.producto.precio}"/>
				<p:outputLabel value="Estado"/>
				<p:outputLabel id="estado" value="#{controladorDetallesProducto.producto.estado}"/>
				<p:outputLabel value="Categoría"/>
				<p:outputLabel id="categoria" value="#{controladorDetallesProducto.producto.categoria}"/>
				<p:outputLabel value="Envío disponible"/>
				<p:outputLabel id="envioDisponible" value="#{controladorDetallesProducto.producto.envioDisponible ? 'Sí' : 'No'}"/>
				<p:outputLabel value="Descripción del sitio de recogida" />
				<p:outputLabel id="descripcionLugarRecogida"
					value="#{controladorDetallesProducto.producto.lugarRecogida == null ? 'NO EXISTE' : controladorDetallesProducto.producto.descripcionLugarRecogida}"/>
				<p:outputLabel value="Vendedor" />
				<p:outputLabel id="vendedor" value="#{controladorDetallesProducto.producto.vendedor}" />
			</p:panelGrid>
		</div>
		<div class="botones">
			<p:button value="Volver" icon="pi pi-arrow-left" outcome="principal.xhtml" styleClass="estilo-boton" />
		</div>
	</h:body>
</html>
