<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<header>
		<section>
			<h:form>
				<div class="botones">
					<p:button value="Principal"
						outcome="principal.xhtml"
						styleClass="estilo-boton" />

					<p:button value="Producto nuevo"
						outcome="crearProducto.xhtml"
						styleClass="estilo-boton" />

					<p:button value="Mis productos"
						outcome="misProductos.xhtml"
						styleClass="estilo-boton" />

					<p:commandButton value="Cerrar sesión"
						icon="pi pi-times"
						action="#{controladorPrincipal.logout}"
						update="messages"
						styleClass="estilo-boton" />
				</div>
			</h:form>
		</section>
	</header>

</ui:composition>
