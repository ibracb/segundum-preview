<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
	<h:head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Inicia sesión en SegundUM</title>
		<style>
			.encabezado {
				display: block;
				text-align: center;
				font-size: 24px;
				font-weight: bold;
				margin: 20px 0;
			}
			.formulario {
				display: flex;
				justify-content: center;
			}
			.botones {
				display: flex;
				justify-content: center;
				margin-top: 40px;
				gap: 20px; 
			}
			.estilo-boton {
				font-size: 20px;
				padding: 10px 20px;
				border-radius: 8px;
				cursor: pointer;
			}
		</style>
	</h:head>
	<h:body>
		<h:outputText value="Inicia sesión en SegundUM" styleClass="encabezado" />
		<p:messages id="messages" showDetail="true" closable="true" />
		<div class="formulario">
			<h:form>
				<p:panelGrid columns="2">
					<p:outputLabel value="Email" />
					<p:inputText value="#{controladorLogin.email}" />
					<p:outputLabel value="Clave" />
					<p:password value="#{controladorLogin.clave}" />
				</p:panelGrid>
				<div class="botones">
					<p:commandButton value="Login" icon="pi pi-check-circle" action="#{controladorLogin.loguear}" update="messages" styleClass="estilo-boton" />
					<p:button value="Cancelar" icon="pi pi-arrow-left" outcome="inicio.xhtml" styleClass="estilo-boton"/>
				</div>
			</h:form>
		</div>
	</h:body>
</html>
