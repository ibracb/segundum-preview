<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Mis productos</title>
	<h:outputStylesheet library="css" name="styles.css" />
	<style>

.texto {
	display: flex;
	justify-content: center;
	text-align: center;
	font-size: 24px;
	margin: 20px 0;
}

.productos-grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr); /* 3 columnas */
	gap: 20px; /* separación entre tarjetas */
	padding: 20px;
}

.producto-card {
	border: 1px solid #ccc;
	padding: 15px;
	border-radius: 10px;
	background: #fafafa;
}

.container {
	display: flex;
	gap: 20px;
	padding: 20px;
}

.sidebar {
	width: 250px;
	padding: 15px;
	border: 1px solid #ccc;
	border-radius: 10px;
	background: #f5f5f5;
}

.main-content {
	flex: 1;
}
</style>
</h:head>

<h:body>
	<ui:include src="/segundum/includes/header.xhtml" />
	<h:outputText value="Mis productos" styleClass="encabezado" />
	<p:messages id="messages" showDetail="true" closable="true" />
	<div class="container">
		<div class="main-content">
			<h:form id="formProductosGrid">
				<div class="productos-grid">
					<ui:repeat value="#{controladorMisProductos.productosVenta}" var="p">
						<div class="producto-card">
							<h3>#{p.titulo}</h3>
							<p>#{p.descripcion}</p>
							<p>
								<strong>Fecha:</strong> #{p.fechaFormateada}
							</p>
							<p>
								<strong>Precio:</strong> #{p.precio} €
							</p>
							<p>
								<strong>Estado:</strong> #{p.estado}
							</p>
							<p>
								<strong>Categoría:</strong> #{p.categoria}
							</p>
							<p>
								<strong>Visualizaciones:</strong> #{p.visualizaciones}
							</p>
							<div class="botones">
								<p:commandButton value="Modificar" action="#{controladorMisProductos.modificarProducto}" styleClass="estilo-boton" >
									<f:setPropertyActionListener target="#{productoActual.productoDTO}" value="#{p}" />
								</p:commandButton>
							</div>
						</div>
					</ui:repeat>
				</div>
			</h:form>
		</div>
	</div>
</h:body>
</html>
