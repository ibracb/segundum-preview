<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Modificar producto</title>
	<h:outputStylesheet library="css" name="styles.css" />
	<style>

.formulario {
	display: flex;
	justify-content: center;
}

.texto {
	display: flex;
	justify-content: center;
	text-align: center;
	font-size: 24px;
	margin: 20px 0;
}

</style>
</h:head>
<h:body>
	<ui:include src="/segundum/includes/header.xhtml" />
	<h:outputText value="Modificar producto" styleClass="encabezado" />
	<p:messages id="messages" showDetail="true" closable="true" />
	<div class="formulario">
		<h:form id="crearProducto">
			<p:panelGrid columns="2">
				<p:outputLabel value="Descripción" for="descripcion" />
				<p:inputText id="descripcion"
					value="#{controladorModificarProducto.descripcion}" />
				<p:outputLabel value="Precio" for="precio" />
				<p:inputText id="precio" value="#{controladorModificarProducto.precio}" />
			</p:panelGrid>
			<div class="botones">
				<p:commandButton value="Modificar" icon="pi pi-check-circle"
					action="#{controladorModificarProducto.modificarProducto}"
					update=":crearProducto messages" styleClass="estilo-boton" />
				<p:button value="Cancelar" icon="pi pi-arrow-left"
					outcome="misProductos.xhtml" styleClass="estilo-boton" />
			</div>
		</h:form>
	</div>
</h:body>
</html>
