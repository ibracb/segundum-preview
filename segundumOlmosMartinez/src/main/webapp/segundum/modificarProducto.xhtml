<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Principal</title>
	<style>
header {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	background: white;
	z-index: 1000;
}

body {
	padding-top: 50px;
}

.encabezado {
	display: block;
	text-align: center;
	font-size: 30px;
	font-weight: bold;
	margin: 20px 0;
}

.formulario {
	display: flex;
	justify-content: center;
}

.texto {
	display: flex;
	justify-content: center;
	text-align: center;
	font-size: 24px;
	margin: 20px 0;
}

.botones {
	display: flex;
	justify-content: center;
	gap: 20px;
}

.estilo-boton {
	font-size: 16px;
	padding: 5px 8px;
	border-radius: 5px;
	cursor: pointer;
}
</style>
</h:head>
<h:body>
	<header> <section> <h:form>
		<div class="botones">
			<p:button value="Principal" outcome="principal.xhtml"
				styleClass="estilo-boton" />
			<p:button value="Producto nuevo" outcome="crearProducto.xhtml"
    			styleClass="estilo-boton" />
			<p:button value="Mis productos" outcome="misProductos.xhtml"
				styleClass="estilo-boton" />
			<p:commandButton value="Cerrar sesión" icon="pi pi-times"
				action="#{controladorPrincipal.logout}" update="messages"
				styleClass="estilo-boton" />
		</div>
	</h:form> </section> </header>
	<h:outputText value="Modificar producto" styleClass="encabezado" />
	<p:messages id="messages" showDetail="true" closable="true" />
	<div class="formulario">
		<h:form id="crearProducto">
			<p:panelGrid columns="2">
				<p:outputLabel value="Título" for="titulo" />
				<p:outputLabel id="titulo"
					value="#{productoActual.productoDTO.titulo}" />
				<p:outputLabel value="Descripción" for="descripcion" />
				<p:inputText id="descripcion"
					value="#{controladorModificarProducto.descripcion}" />
				<p:outputLabel value="Precio" for="precio" />
				<p:inputText id="precio" value="#{controladorModificarProducto.precio}" />
				<p:outputLabel value="Estado" for="estado" />
				<p:outputLabel id="estado"
					value="#{productoActual.productoDTO.estado}" />
				<p:outputLabel value="Categoría" for="categoria" />
				<p:outputLabel id="categoria"
					value="#{productoActual.productoDTO.categoria}" />
				<p:outputLabel value="Envío disponible" for="envioDisponible" />
				<p:outputLabel id="envioDisponible"
					value="#{productoActual.productoDTO.envioDisponible ? 'Sí' : 'No'}" />
				<p:outputLabel value="Descripción del sitio de recogida" />
				<p:outputLabel id="descripcionLugarRecogida"
					value="#{productoActual.productoDTO.lugarRecogida == null ? ' ' : productoActual.productoDTO.descripcionLugarRecogida}" />
				<p:outputLabel value="Longitud del lugar de recogida" />
				<p:outputLabel id="longitudLugarRecogida"
					value="#{productoActual.productoDTO.lugarRecogida == null ? 0.0 : productoActual.productoDTO.longitudLugarRecogida}" />
				<p:outputLabel value="Latitud del lugar de recogida" />
				<p:outputLabel id="latitudLugarRecogida"
					value="#{productoActual.productoDTO.lugarRecogida == null ? 0.0 : productoActual.productoDTO.latitudLugarRecogida}" />
			</p:panelGrid>
			<div class="botones">
				<p:commandButton value="Modificar" icon="pi pi-check-circle"
					action="#{controladorModificarProducto.modificarProducto}"
					update=":crearProducto messages" styleClass="estilo-boton" />
				<p:button value="Cancelar" icon="pi pi-arrow-left"
					outcome="misProductos.xhtml" styleClass="estilo-boton" />
			</div>
		</h:form>
	</div>
</h:body>
</html>
