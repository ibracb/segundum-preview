<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
	<h:head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Principal</title>
		<style>
			.encabezado {
				display: block;
				text-align: center;
				font-size: 24px;
				font-weight: bold;
				margin: 20px 0;
			}
			.estilo-boton {
				font-size: 20px;
				padding: 10px 20px;
				border-radius: 8px;
				cursor: pointer;
			}
		</style>
	</h:head>
	<h:body>
		<h:outputText value="Principal" styleClass="encabezado"/>
		<h:outputText value="¡Hola, #{sesionUsuario.getNombreCompleto()}!" />
		<p:messages id="messages" showDetail="true" closable="true" />
		<p:commandButton value="Cerrar sesión" icon="pi pi-times" action="#{controladorPrincipal.logout}" update="messages" styleClass="estilo-boton" />
	</h:body>
</html>
