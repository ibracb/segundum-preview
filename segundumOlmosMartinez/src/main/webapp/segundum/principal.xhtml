<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Principal</title>
	<style>
header {
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	background: white;
	z-index: 1000;
}

body {
	padding-top: 50px;
}

.encabezado {
	display: block;
	text-align: center;
	font-size: 30px;
	font-weight: bold;
	margin: 20px 0;
}

.texto {
	display: flex;
	justify-content: center;
	text-align: center;
	font-size: 24px;
	margin: 20px 0;
}

.botones {
	display: flex;
	justify-content: center;
	gap: 20px;
}

.estilo-boton {
	font-size: 16px;
	padding: 5px 8px;
	border-radius: 5px;
	cursor: pointer;
}

.productos-grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 20px;
	padding: 20px;
}

.producto-card {
	border: 1px solid #ccc;
	padding: 15px;
	border-radius: 10px;
	background: #fafafa;
}

.container {
	display: flex;
	gap: 20px;
	padding: 20px;
}

.sidebar {
	width: 250px;
	padding: 15px;
	border: 1px solid #ccc;
	border-radius: 10px;
	background: #f5f5f5;
}

.main-content {
	flex: 1;
}

.filtro-campo {
	margin-bottom: 15px;
}

.filtro-campo label {
	display: block;
	margin-bottom: 5px;
	font-weight: bold;
}
</style>
</h:head>

<h:body>
	<header> <section> <h:form>
		<div class="botones">
			<p:button value="Principal" outcome="principal.xhtml"
				styleClass="estilo-boton" />
			<p:button value="Producto nuevo" outcome="crearProducto.xhtml"
				styleClass="estilo-boton" />
			<p:button value="Mis productos" outcome="misProductos.xhtml"
				styleClass="estilo-boton" />
			<p:commandButton value="Cerrar sesión" icon="pi pi-times"
				action="#{controladorPrincipal.logout}" update="messages"
				styleClass="estilo-boton" />
		</div>
	</h:form> </section> </header>

	<h:outputText value="Principal" styleClass="encabezado" />
	<h:outputText value="¡Hola, #{sesionUsuario.getNombreCompleto()}!"
		styleClass="texto" />
	<p:messages id="messages" showDetail="true" closable="true" />
	<div class="container">
		<div class="sidebar">
			<h:form id="formFiltros">
				<h3>Buscar productos</h3>

				<div class="filtro-campo">
					<p:outputLabel value="Descripción" for="filtroDescripcion" />
					<p:inputText id="filtroDescripcion"
						value="#{controladorPrincipal.filtroDescripcion}"
						placeholder="Descripción" style="width:100%;" />
				</div>

				<div class="filtro-campo">
					<p:outputLabel value="Precio máximo" for="filtroPrecio" />
					<p:inputText id="filtroPrecio"
						value="#{controladorPrincipal.filtroPrecioMaximo}"
						placeholder="Precio" style="width:100%;" />
				</div>

				<div class="filtro-campo">
					<p:outputLabel value="Estado" for="filtroEstado" />
					<p:selectOneMenu id="filtroEstado"
						value="#{controladorPrincipal.filtroEstado}"
						style="width:100%;font-size:12px;">
						<f:selectItem itemLabel="-- Todos --" itemValue="#{null}" />
						<f:selectItems value="#{controladorCrearProducto.estados}" var="e"
							itemValue="#{e}" itemLabel="#{e}" />
					</p:selectOneMenu>
				</div>

				<div class="filtro-campo">
					<p:outputLabel value="Categoría" for="filtroCategoria" />
					<p:selectOneMenu id="filtroCategoria"
						value="#{controladorPrincipal.filtroCategoria}"
						style="width:100%;font-size:12px;">
						<f:selectItem itemLabel="-- Todas --" itemValue="#{null}" />
						<f:selectItems value="#{controladorCrearProducto.categorias}"
							var="c" itemValue="#{c.id}" itemLabel="#{c.nombre}" />
					</p:selectOneMenu>
				</div>

				<p:commandButton value="Buscar por filtros" icon="pi pi-search"
					action="#{controladorPrincipal.buscarPorFiltros}"
					update="formProductosGrid messages" styleClass="estilo-boton"
					style="width:100%; margin-bottom:10px;" />

				<p:commandButton value="Limpiar filtros" icon="pi pi-times"
					action="#{controladorPrincipal.limpiarFiltros}"
					update="formProductosGrid messages formFiltros"
					styleClass="estilo-boton" style="width:100%;" />
			</h:form>


		</div>
		<div class="main-content">
			<h:form id="formProductosGrid">
				<div class="productos-grid">
					<ui:repeat value="#{controladorPrincipal.productosVenta}" var="p">
						<div class="producto-card">
							<h3>#{p.titulo}</h3>
							<p>#{p.descripcion}</p>
							<p>
								<strong>Categoría:</strong> #{p.categoria}
							</p>
							<p>
								<strong>Precio:</strong> #{p.precio} €
							</p>
							<p>
								<strong>Estado:</strong> #{p.estado}
							</p>
							<div class="botones">
								<p:commandButton value="Ver más"
									action="#{controladorPrincipal.verProducto}"
									styleClass="estilo-boton">
									<f:setPropertyActionListener
										target="#{productoActual.productoDTO}" value="#{p}" />
								</p:commandButton>
							</div>
						</div>
					</ui:repeat>
				</div>
			</h:form>
		</div>
	</div>
</h:body>
</html>
