<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
	<h:head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Regístrate en SegundUM</title>
		<style>
			.encabezado {
				display: block;
				text-align: center;
				font-size: 24px;
				font-weight: bold;
				margin: 20px 0;
			}
			.formulario {
				display: flex;
				justify-content: center;
			}
			.botones {
				display: flex;
				justify-content: center;
				margin-top: 40px;
				gap: 20px; 
			}
			.estilo-boton {
				font-size: 20px;
				padding: 10px 20px;
				border-radius: 8px;
				cursor: pointer;
			}
		</style>
	</h:head>
	<h:body>
		<h:outputText value="Regístrate en SegundUM" styleClass="encabezado"/>
		<p:messages id="messages" showDetail="true" closable="true" />
		<div class="formulario">
			<h:form>
				<p:panelGrid columns="2">
					<p:outputLabel value="Nombre" for="nombre" />
					<p:inputText id="nombre" value="#{controladorRegistro.nombre}" />
					<p:outputLabel value="Apellidos" for="apellidos" />
					<p:inputText id="apellidos" value="#{controladorRegistro.apellidos}" />
					<p:outputLabel value="Email" for="email" />
					<p:inputText id="email" value="#{controladorRegistro.email}"
						placeholder="nombre@ejemplo.com" />
					<p:outputLabel value="Clave" for="clave" />
					<p:password id="clave" value="#{controladorRegistro.clave}" />
					<p:outputLabel value="Fecha de nacimiento" for="fecha" />
					<p:datePicker id="fecha" value="#{controladorRegistro.fechaNacimiento}"
						showIcon="true" pattern="dd/MM/yyyy" showOnFocus="false"
						mask="true" placeholder="dd/mm/aaaa" />
					<p:outputLabel value="Teléfono" for="telefono" />
					<p:inputText id="telefono" value="#{controladorRegistro.telefono}"
						placeholder="123456789"/>
				</p:panelGrid>
				<div class="botones">
					<p:commandButton value="Registrar" icon="pi pi-check-circle"
						action="#{controladorRegistro.registrar}" update="messages"
						classStyle="estilo-boton" />
					<p:button value="Cancelar" icon="pi pi-arrow-left"
						outcome="inicio.xhtml" classStyle="estilo-boton" />
				</div>
			</h:form>
		</div>
	</h:body>
</html>
